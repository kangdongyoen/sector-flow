name: 섹터 흐름판 갱신

on:
  schedule:
    # 시각은 전부 UTC. 한국시간(KST) = UTC + 9시간
    - cron: '37 23 * * 0-4'    # 08:37 KST  개장 전 (미국 마감 반영)
    - cron: '7,37 0-6 * * 1-5' # 09:07 ~ 15:37 KST  장중 30분마다
    - cron: '47 6 * * 1-5'     # 15:47 KST  마감 확정
  workflow_dispatch:           # 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: flowboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install --quiet yfinance pandas

      - name: 데이터 수집
        run: python collect.py

      - name: 화면 생성
        run: python build.py

      - name: 결과 커밋
        run: |
          git config user.name  "flowboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --staged --quiet; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git push
          fi
