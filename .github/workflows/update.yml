name: 섹터 흐름판 갱신

on:
  # 실시간 화면과 기록 · 카톡은 전부 Cloudflare 가 맡는다.
  # 여기서는 하루 한 번, 첫 화면에 박아 둘 예비 데이터와 일정표만 새로 만든다.
  # 커밋 한 번이 Cloudflare 빌드 한 번이라, 자주 돌리면 무료 빌드 한도(월 500회)를 다 쓴다.
  schedule:
    # 시각은 UTC. 한국시간(KST) = UTC + 9시간
    - cron: '17 8 * * 1-5'     # 17:17 KST  마감 뒤 하루 한 번
  workflow_dispatch:           # 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: flowboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 보관
        run: python collect.py

      - name: 화면 생성
        run: python build.py

      - name: 결과 커밋
        run: |
          git config user.name  "flowboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --staged --quiet; then
            echo "변경 없음, 커밋 건너뜀"
          else
            git commit -m "갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git push
          fi
