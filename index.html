<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="예측이 아니라 실제 체결 숫자. 종목이 아니라 업종 단위로 오늘 돈이 어디로 갔는지 보는 화면">
<title>섹터 흐름판</title>
<meta name="theme-color" content="#121211">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LUCENT">
<meta property="og:title" content="LUCENT 섹터 흐름판">
<meta property="og:description" content="예측이 아니라 실제 체결 숫자. 오늘 돈이 어느 업종으로 들어가고 빠졌는지 한눈에. 장중 30초마다 갱신.">
<meta property="og:url" content="https://lucent-sector.pages.dev/">
<meta property="og:image" content="https://lucent-sector.pages.dev/assets/og.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="섹터 흐름">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --primary:#1F1F1F; --gold:#D4AF7C; --up:#E74C4C; --down:#3B82F6; --bg:#FAF9F6;
  --surface:#FFFFFF; --soft:#F5F3EF; --track:#EDEAE4;
  --t1:#1F1F1F; --t2:#5C5B55; --t3:#9B9891;
  --line:#EDEAE3; --line-2:#DFDBD3;
  --up-tint:#FCEDEC; --down-tint:#EDF3FE; --up-bar:#F7D8D7; --down-bar:#D8E4FB;
  --gold-soft:rgba(212,175,124,.18);
  --dark:#121211; --dark-2:#1F1F1F; --on-dark:#F7F4ED; --on-dark-2:#A29B90;
  --btn:#1F1F1F; --btn-t:#FAF9F6;
  --shadow:0 1px 2px rgba(31,31,31,.04), 0 14px 30px -20px rgba(31,31,31,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0D; --surface:#1A1A18; --soft:#1F1F1C; --track:#26261F;
    --t1:#F3F1EC; --t2:#A8A49C; --t3:#75726A;
    --line:#282824; --line-2:#383731;
    --up:#F0696A; --down:#5F97F7; --gold:#DCBB8A;
    --up-tint:#221818; --down-tint:#141B29; --up-bar:#4A2A2A; --down-bar:#22355C;
    --dark:#000000; --dark-2:#131312;
    --btn:#F3F1EC; 
    --btn-t:#171715;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 34px -22px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0D; --surface:#1A1A18; --soft:#1F1F1C; --track:#26261F;
  --t1:#F3F1EC; --t2:#A8A49C; --t3:#75726A;
  --line:#282824; --line-2:#383731;
  --up:#F0696A; --down:#5F97F7; --gold:#DCBB8A;
  --up-tint:#221818; --down-tint:#141B29; --up-bar:#4A2A2A; --down-bar:#22355C;
  --dark:#000000; --dark-2:#131312;
  --btn:#F3F1EC; --btn-t:#171715;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 34px -22px rgba(0,0,0,.95);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0; color:var(--t1);
  font-family:Pretendard,"Pretendard Variable","IBM Plex Sans KR",-apple-system,
    BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  word-break:keep-all; line-height:1.5; -webkit-font-smoothing:antialiased;}
.num{font-variant-numeric:tabular-nums}
.u{color:var(--up)} .d{color:var(--down)} .f{color:var(--t3)}
button{font:inherit; color:inherit; background:none; border:0}
.inn{max-width:440px; margin:0 auto; padding-inline:20px}

/* ── 상단 바 ── */
.topbar{background:var(--bg)}
.topbar.on-dark{background:var(--dark)}
.tb{display:flex; align-items:center; gap:10px; min-height:56px; padding-block:6px 10px;}
.brand{flex:1; min-width:0}
.brand .bn{font-size:19px; font-weight:700; letter-spacing:.36em; color:var(--gold); line-height:1.1}
.brand .bs{font-size:10.5px; letter-spacing:.14em; color:var(--on-dark-2); margin-top:5px}
.htitle{flex:1; text-align:center; font-size:17px; font-weight:700}
.on-dark .htitle{color:var(--on-dark)}
.icons{display:flex; gap:2px; flex-shrink:0}
.ibtn{cursor:pointer; padding:8px; position:relative; line-height:0; color:var(--t1)}
.on-dark .ibtn{color:var(--on-dark)}
.ibtn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}
.ibtn .dm{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%;
  background:var(--up); border:1.5px solid var(--dark)}
.ibtn[data-on="1"]{color:var(--gold)}
.ibtn:focus-visible{outline:2px solid var(--gold); outline-offset:-2px; border-radius:8px}
.back{cursor:pointer; font-size:26px; line-height:1; padding:4px 10px 8px 0; color:var(--t1)}
.on-dark .back{color:var(--on-dark)}

/* ── 시트 ── */
.sheet{background:var(--bg); min-height:70vh;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.sheet.lift{border-radius:22px 22px 0 0; margin-top:-2px; position:relative; z-index:1;
  padding-top:14px}
.sheet:not(.lift){padding-top:2px}

/* ── 검색 ── */
.sbar{display:none; padding-block:2px 12px}
.sbar.on{display:block}
.sbar input{width:100%; border:1px solid var(--line-2); background:var(--surface); color:var(--t1);
  border-radius:12px; padding:13px 15px; font:500 14px/1.2 inherit}
.sbar input:focus{outline:2px solid var(--gold); outline-offset:-1px}

/* ── 날짜 ── */
.dateline{font-size:17px; font-weight:700; margin:8px 0 14px;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.dd{font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:6px;
  background:var(--gold-soft); color:var(--gold)}
/* ── 화면 크기 대응 ──
   폰은 한 줄, 태블릿은 두 줄, 데스크톱은 세 줄로 편다.
   폰에서 좁게 끼여 보이던 건 viewport 태그가 없어서였다. */
@media (min-width:760px){
  .inn{max-width:700px; padding-inline:28px}
  .hero{padding:26px 24px 24px}
  .hero h1{font-size:30px}
  .tlist{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .pair{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start}
  .pair .card{margin-bottom:0}
}
@media (min-width:1120px){
  .inn{max-width:1040px}
  .tlist{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:34px; max-width:14em}
  .sheet{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}

/* ── 지수 ──
   숫자를 먼저 보고, 그 아래 등락률. 폰에서 네 칸이 한 줄에 들어가게 짰다. */
.ixh{font-size:11.5px; font-weight:700; color:var(--t3); letter-spacing:.02em; margin:0 0 7px}
.ixg + .ixg{margin-top:14px}
.ixrow{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.ixrow.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ix{background:var(--surface); border-radius:11px; padding:9px 9px 8px; min-width:0}
.ix .n{font-size:11.5px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ix .v{font-size:14px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ix .c{font-size:12px; font-weight:700; margin-top:1px}
.ix .s{font-size:10px; color:var(--t3); font-weight:600}
.ixrow.k3 .v{font-size:15px}
@media (min-width:760px){ .ix{padding:11px 12px 10px} .ix .v{font-size:15.5px} }
/* 넓은 화면에서는 세 묶음을 한 줄에 편다. 지수 칸이 화면을 다 먹지 않게. */
.ix .vi{display:none}
@media (min-width:1120px){
  .ix .vf{display:none} .ix .vi{display:inline}
  .ixwrap{display:grid; grid-template-columns:3fr 4fr 4fr; gap:18px}
  .ixg + .ixg{margin-top:0}
  .ix{padding:10px 10px 9px} .ix .v{font-size:14.5px}
}

/* ── 수급 · 종목 폭 ── */
.mk{margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.mkh{display:flex; align-items:baseline; gap:8px; font-size:13px; font-weight:700}
.mkh .f{font-weight:600; font-size:11.5px; margin-left:auto}
.inv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:8px}
.inv>div{background:var(--surface); border-radius:10px; padding:8px 9px}
.inv .k{font-size:11.5px; color:var(--t2)}
.inv .v{font-size:14px; font-weight:700; margin-top:1px; white-space:nowrap}
.brd{display:flex; height:6px; border-radius:999px; overflow:hidden; background:var(--track); margin-top:9px}
.brd i{display:block; height:100%}
.brd .up{background:var(--up)} .brd .dn{background:var(--down)} .brd .fl{background:var(--t3); opacity:.3}
.brdl{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; font-weight:600; margin-top:6px; color:var(--t2)}
.insight{font-size:12.5px; color:var(--t2); margin-top:7px; line-height:1.6}
.insight b{color:var(--t1)}
/* ── 지난 30분 ── */
.fast{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.fast .col{min-width:0}
@media (max-width:519px){ .fast{grid-template-columns:minmax(0,1fr); gap:6px} .fast .col + .col h4{margin-top:10px} }
.fast .col h4{margin:0 0 4px; font-size:12px; color:var(--t3); font-weight:700}
.frow{display:flex; align-items:baseline; gap:8px; padding:9px 0; border-top:1px solid var(--line); cursor:pointer; width:100%; text-align:left}
.frow .n{font-size:14px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.frow .v{font-size:13px; font-weight:700; flex-shrink:0}
/* ── 오늘 체크 · 헤드라인 ── */
.chk h4{margin:0 0 6px; font-size:12px; color:var(--t3); font-weight:700; display:flex; gap:8px; align-items:baseline}
.chk h4 .f{margin-left:auto; font-weight:600; font-size:11px}
.chk .blk + .blk{margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
.cev{display:flex; align-items:baseline; gap:9px; padding:5px 0}
.cev .dd2{flex-shrink:0; min-width:38px; font-size:12px; font-weight:700; text-align:center; padding:3px 0; border-radius:7px;
  background:var(--soft); color:var(--t2)}
.cev .dd2.now{background:var(--gold-soft); color:var(--t1)}
.cev .tt{font-size:14px; font-weight:700; min-width:0}
.cev .nn{font-size:12px; color:var(--t3); font-weight:500}
.nw{display:block; padding:9px 0; border-top:1px solid var(--line); color:inherit; text-decoration:none}
.nwl .nw:first-child{border-top:0; padding-top:2px}
.nw .nt{display:block; font-size:14.5px; font-weight:600; line-height:1.45; color:var(--t1)}
.nw .nm{display:block; font-size:11.5px; color:var(--t3); margin-top:3px}
.nw .nm .tg{color:var(--t2); font-weight:700}
.nw:hover .nt, .nw:focus-visible .nt{text-decoration:underline; text-underline-offset:3px}
.nwmore{display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; color:var(--t2); text-decoration:none}
/* ── 오늘 흐름 선 ── */
.iline{width:100%; height:150px; display:block}
.iline .zero{stroke:var(--line-2); stroke-dasharray:3 3}
.iaxis{display:flex; justify-content:space-between; font-size:11px; color:var(--t3); margin-top:4px}

/* ── 오늘 한눈에 ── */
.split{display:flex; height:9px; border-radius:999px; overflow:hidden; background:var(--track)}
.split i{display:block; height:100%}
.split .up{background:var(--up)} .split .dn{background:var(--down)}
.split .fl{background:var(--t3); opacity:.3}
.gl{display:flex; gap:14px; flex-wrap:wrap; font-size:13.5px; font-weight:700; margin-top:11px}
.gl2{font-size:13.5px; font-weight:600; margin-top:9px; color:var(--t2);
  display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.gl2 b{color:var(--t1); font-weight:700}

.livedot{display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--up); margin-right:5px; vertical-align:middle;
  animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}

/* ── 히어로 ── */
.hero{position:relative; overflow:hidden; border-radius:16px; padding:22px 20px 20px;
  background:linear-gradient(135deg,var(--dark) 0%,var(--dark-2) 55%,#2B241C 100%);
  color:var(--on-dark); box-shadow:var(--shadow); display:block; width:100%; text-align:left;
  cursor:pointer}
.hero .eyebrow{font-size:11px; color:var(--on-dark-2); letter-spacing:.06em; margin-bottom:14px;
  position:relative; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.hero .fact{margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:0; color:var(--gold);
  background:rgba(212,175,124,.14); padding:3px 9px; border-radius:999px; white-space:nowrap}
.hero h1{font-size:26px; line-height:1.36; font-weight:700; letter-spacing:-.025em;
  margin:0 0 18px; position:relative; max-width:11em; text-wrap:balance}
.hero .mood{display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; position:relative}
.pip{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.pip.good{background:#3ECF8E} .pip.warn{background:var(--gold)} .pip.bad{background:var(--up)}
.hero .why{font-size:12.5px; color:var(--on-dark-2); margin-top:9px; position:relative}
.hero .chev{position:absolute; right:20px; bottom:18px; color:var(--on-dark-2); font-size:22px; line-height:1}
.wave{position:absolute; right:-30px; bottom:-40px; width:230px; height:230px; opacity:.85; pointer-events:none}

/* ── 세그먼트 탭 ── */
.seg{display:flex; background:var(--track); border-radius:999px; padding:5px; margin:16px 0 14px}
.seg button{flex:1; padding:11px 6px; border-radius:999px; font-weight:700; font-size:13.5px;
  color:var(--t3); cursor:pointer; white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--primary); color:#FAF9F6}
:root[data-theme="dark"] .seg button[aria-selected="true"]{background:var(--t1); color:#171715}
.seg button:focus-visible{outline:2px solid var(--gold); outline-offset:-3px}

/* ── 칩 ── */
.chips{display:flex; gap:9px; margin:14px 0; overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--track); color:var(--t2); font-weight:700; font-size:13.5px;
  padding:11px 20px; border-radius:999px; white-space:nowrap; cursor:pointer; flex-shrink:0}
.chip[aria-selected="true"]{background:var(--primary); color:#FAF9F6}
:root[data-theme="dark"] .chip[aria-selected="true"]{background:var(--t1); color:#171715}
.chip[disabled]{opacity:.4; cursor:not-allowed}
.chip:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

/* ── 카드 ── */
.card{background:var(--soft); border-radius:16px; margin-bottom:12px; overflow:hidden}
.card.tint-up{background:var(--up-tint)} .card.tint-dn{background:var(--down-tint)}
.chead{display:flex; align-items:center; gap:8px; padding:18px 18px 10px}
.ctitle{font-size:16px; font-weight:700}
.ctitle.in{color:var(--up)} .ctitle.out{color:var(--down)}
.more{margin-left:auto; cursor:pointer; font-size:12px; font-weight:600; color:var(--t3); flex-shrink:0}
.more:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:5px}
.cbody{padding:0 18px 16px}

/* ── 홈 순위 ── */
.ritem{display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:7px 12px;
  width:100%; padding:11px 0 9px; cursor:pointer; text-align:left}
.ritem:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:8px}
.rno{font-size:12.5px; font-weight:600; color:var(--t3)}
.rname{font-size:16px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.rval{font-size:16px; font-weight:700}
.rbar{grid-column:2/4; height:3px; border-radius:2px}
.rbar.up{background:var(--up-bar)} .rbar.dn{background:var(--down-bar)}
.rbar i{display:block; height:100%; border-radius:2px}

/* ── 그룹 라벨 ── */
.glab{display:flex; align-items:center; gap:8px; margin:20px 2px 12px; font-size:17px; font-weight:700}
.glab.in{color:var(--up)} .glab.out{color:var(--down)}
.glab .more{font-size:12px}

/* ── 톤 행 ── */
.tlist{display:flex; flex-direction:column; gap:9px}
.titem{display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-rows:auto auto;
  align-items:center; column-gap:11px; row-gap:3px;
  width:100%; border-radius:14px; padding:16px 16px 14px; cursor:pointer; text-align:left}
.titem.up{background:var(--up-tint)} .titem.dn{background:var(--down-tint)}
.titem .lead{grid-column:1; grid-row:1/3; font-size:16px; font-weight:700; line-height:1}
.titem.up .lead{color:var(--up)} .titem.dn .lead{color:var(--down)}
.titem .tn{grid-column:2; grid-row:1; font-size:17px; font-weight:700;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.titem .tw{grid-column:2; grid-row:2; font-size:12.5px; color:var(--t3); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.titem .rt{grid-column:3; grid-row:1/3; display:flex; flex-direction:column;
  align-items:flex-end; gap:3px}
.titem .tv{font-size:17px; font-weight:700; white-space:nowrap}
.titem .tc{font-size:16px; color:var(--t3); line-height:1}
.titem:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

.tag{font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px;
  background:rgba(31,31,31,.07); color:var(--t2); white-space:nowrap}
:root[data-theme="dark"] .tag{background:rgba(255,255,255,.1)}
.tag.hot{background:var(--gold-soft); color:var(--gold)}

/* ── 상세 ── */
.dwrap{background:var(--dark)}
.dhero{position:relative; overflow:hidden; color:var(--on-dark);
  background:linear-gradient(120deg,var(--dark) 0%,var(--dark-2) 50%,#2C251C 100%)}
.dhero .pad{padding-block:14px 30px; position:relative}
.dhero .dn{font-size:22px; font-weight:700}
.dhero .dv{font-size:42px; font-weight:700; letter-spacing:-.035em; margin-top:4px; line-height:1.08}
.dhero .dv small{font-size:24px; margin-left:4px}
.dhero .dw{font-size:13px; color:var(--on-dark-2); margin-top:12px}
.circuit{position:absolute; right:-20px; top:-10px; width:210px; height:210px; opacity:.9}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
.stat{background:var(--soft); border-radius:14px; padding:15px 12px}
.stat .k{font-size:11.5px; color:var(--t3)}
.stat .v{font-size:19px; font-weight:700; margin-top:5px; letter-spacing:-.02em}
.stat .s{font-size:12px; font-weight:700; margin-top:3px}

/* ── 캔들 ── */
.candles{display:flex; align-items:stretch; gap:0; height:150px; padding-top:6px}
.cd{flex:1; display:flex; flex-direction:column; align-items:center; min-width:0}
.cd .plot{flex:1; width:100%; position:relative}
.cd .wick{position:absolute; left:50%; width:1.5px; transform:translateX(-50%); background:var(--line-2)}
.cd .body{position:absolute; left:50%; width:26px; transform:translateX(-50%); border-radius:3px}
.cd .lb{font-size:12px; color:var(--t3); padding-top:9px}

/* ── 리스트 ── */
.lrow{display:flex; align-items:baseline; gap:12px; padding:14px 0; border-top:1px solid var(--line)}
.llist .lrow:first-child{border-top:0; padding-top:4px}
.lrow .ln{font-size:15px}
.lrow .ll{margin-left:auto; font-size:14px; color:var(--t3)}
.lrow .lc{margin-left:auto; font-size:15px; font-weight:700; text-align:right; flex-shrink:0}
.lrow .ll ~ .lc{margin-left:0; width:74px}

/* ── 캘린더 ── */
.ev{display:grid; grid-template-columns:54px 1fr auto; gap:3px 13px; align-items:center;
  padding:15px 0; border-top:1px solid var(--line)}
.evlist .ev:first-child{border-top:0; padding-top:4px}
.ev .dcol{font-size:13px; font-weight:700; text-align:center; padding:6px 0; border-radius:8px;
  background:var(--track); color:var(--t2); grid-row:1/3}
.ev.soon .dcol{background:var(--gold-soft); color:var(--gold)}
.ev .t{font-size:15.5px; font-weight:700}
.ev .k{font-size:11px; color:var(--t3)}
.ev .m{grid-column:2/4; font-size:12px; color:var(--t3)}

/* ── 버튼/기타 ── */
.cta{width:100%; background:var(--btn); color:var(--btn-t); font-weight:700; font-size:15px;
  padding:19px; border-radius:999px; cursor:pointer; margin-top:14px;
  display:flex; align-items:center; justify-content:center; gap:8px}
.cta[aria-pressed="true"]{background:var(--soft); color:var(--t1); box-shadow:inset 0 0 0 1px var(--line-2)}
.cta svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round}
.cta:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.empty{padding:46px 16px; text-align:center; color:var(--t3); font-size:14px; line-height:1.9}
.note{font-size:12px; line-height:1.85; color:var(--t3); padding:6px 2px 10px}
.note b{color:var(--t2); font-weight:600}
.alert{margin-bottom:12px; padding:14px 16px; border-radius:12px; font-size:12.5px;
  background:var(--up-tint); color:var(--up)}
.panel{background:var(--soft); border-radius:14px; padding:16px 17px; margin-bottom:12px;
  font-size:13px; color:var(--t2); line-height:1.85}
.panel b{color:var(--t1)}
.quote{background:linear-gradient(135deg,var(--dark),var(--dark-2)); color:var(--on-dark-2);
  border-radius:16px; padding:22px 20px; margin-bottom:12px; font-size:13.5px; line-height:1.9;
  position:relative; overflow:hidden}
.quote b{color:var(--gold); display:block; letter-spacing:.3em; font-size:14px; margin-bottom:10px}

/* ── 하단 네비 ── */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:440px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.nav button{cursor:pointer; padding:11px 0 12px; display:flex; flex-direction:column;
  align-items:center; gap:5px; color:var(--t3); font-weight:600; font-size:11px}
.nav button[aria-current="page"]{color:var(--t1)}
.nav button[aria-current="page"] svg{stroke:var(--gold); fill:var(--gold-soft)}
.nav svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.nav button:focus-visible{outline:2px solid var(--gold); outline-offset:-3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

          <div class="lrow"><span class="ln">${esc(g.name)}${g.stale?`<span class="tag">${g.stale}분 전</span>`:''}</span>
            <span class="ll num">${g.unit==='$'?'$':''}${['kr','us','asia'].includes(g.kind)?g.last.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):g.last.toLocaleString()}${g.unit&&g.unit!=='$'?g.unit:''}</span>
            <span class="lc num ${cls(g.chg)}">${fmt(g.chg)}</span></div>`).join('')}</div></div></div>`;
    }).join('')+`<p class="note"><b>무슨 기준인가.</b> 전부 <b>전일 종가 대비</b>입니다.<br>
      <b>미국 지수</b>는 한국 낮 동안 어젯밤 마감 숫자 그대로입니다. 지금 미국 분위기는 <b>선물</b>로 봅니다.<br>
      <b>아시아 지수</b>는 한국과 같은 시간에 열려 있어 지금 움직입니다. 거래소에 따라 몇 분에서 15분쯤 늦게 들어올 수 있습니다.<br>
      선물 · 환율 · 코인은 24시간 돌아가므로 지금 값과 전일 정산가를 비교합니다.</p>`;
  }

  /* 일정 D-day 는 보는 순간 한국 날짜로 다시 센다. 지난 일정은 뺀다. */
  function calNow(){
    const k=new Date(Date.now()+9*3600*1000), t=Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate());
    return (d.calendar||[]).map(e=>{
      const [y,mo,dd]=e.date.split('-').map(Number), n=Math.round((Date.UTC(y,mo-1,dd)-t)/86400000);
      return Object.assign({},e,{dday:n,dtext:n===0?'오늘':n===1?'내일':'D-'+n});
    }).filter(e=>e.dday>=0);
  }

  /* 지난 30분 사이 속도가 붙은 업종과 식는 업종. 장중에만 보인다. */
  function fastCard(){
    if(!d.intraday||!d.is_live) return '';
    const S=d.sectors.filter(s=>typeof s.d30==='number');
    if(!S.length) return '';
    const up=S.filter(s=>s.d30>=0.2).sort((a,b)=>b.d30-a.d30).slice(0,3);
    const dn=S.filter(s=>s.d30<=-0.2).sort((a,b)=>a.d30-b.d30).slice(0,3);
    const row=s=>`<button class="frow" data-open="${esc(s.name)}"><span class="n">${esc(s.name)}</span>
      <span class="v num ${cls(s.d30)}">${s.d30>0?'+':''}${s.d30.toFixed(2)}%p</span></button>`;
    const col=(h,l)=>`<div class="col"><h4>${h}</h4>${l.length?l.map(row).join(''):'<div class="note">뚜렷한 곳 없음</div>'}</div>`;
    return `<div class="card"><div class="chead"><span class="ctitle">지난 30분</span>
        <span class="more" style="cursor:default">${esc(d.intraday.from)} 대비</span></div>
      <div class="cbody"><div class="fast">${col('속도 붙는 곳',up)}${col('식는 곳',dn)}</div>
        <div class="note">하루 등락률이 30분 전보다 얼마나 더 올랐는지(%p)입니다. 지금 돈이 어디로 움직이는지 보는 칸입니다.</div></div></div>`;
  }

  /* ── 홈 ── */
  function scHome(){
    const m=d.mood, max=Math.max(1,...d.sectors.map(s=>Math.abs(s.chg))), next=calNow()[0];
    const tabs=['자금흐름','전체섹터','글로벌'];
    let panel;
    if(route.tab===0){
      panel=`${fastCard()}<div class="pair"><div class="card tint-up"><div class="chead"><span class="ctitle in">돈이 들어간 곳</span>
          <button class="more" data-go="flow">더보기 ›</button></div>
          <div class="cbody">${rankRows(d.top_in,max,'up')}</div></div>
        <div class="card tint-dn"><div class="chead"><span class="ctitle out">돈이 빠진 곳</span>
          <button class="more" data-go="flow">더보기 ›</button></div>
          <div class="cbody">${rankRows(d.top_out,max,'dn')}</div></div></div>`;
    } else if(route.tab===1){ panel=toneRows(d.sectors); }
    else { panel=globalCards(); }
    const on=!!d.is_live;
    const stamp = on ? `<span class="livedot"></span>실시간` : `${esc((d.updated||'').slice(11))} 기준`;
    return `<div class="dateline">${esc(d.date_label||'')} (${d.weekday}) · ${esc(d.market_label.split(' · ')[0])} · ${stamp}
        ${next?`<span class="dd">${esc(next.dtext)} ${esc(next.title)}</span>`:''}</div>
      <button class="hero" data-go="more">${WAVE}
        <div class="eyebrow"><span>${on?'지금 시장 흐름':(d.is_today===false&&d.trade_label?`${esc(d.trade_label)} 기록`:'오늘의 기록')}</span><span class="fact">예측 아님 · 실제 체결 숫자</span></div>
        <h1>${esc(d.headline)}</h1>
        <div class="mood"><span class="pip ${m.mood==='좋음'?'good':m.mood==='나쁨'?'bad':'warn'}"></span>분위기 ${esc(m.mood)}</div>
        <div class="why">${m.why.length?esc(m.why.join(' · ')):esc(d.subline)}</div>
        <span class="chev">›</span></button>
      ${indexCard()}
      ${checkCard()}
      ${glance()}
      <div class="seg" role="tablist">${tabs.map((t,i)=>`<button role="tab" data-tab="${i}" aria-selected="${route.tab===i}">${t}</button>`).join('')}</div>
      ${panel}`;
  }

  /* 지수 칸. 업종 숫자는 지수와 나란히 봐야 뜻이 생긴다.
     업종 +2% 도 코스피가 +3% 면 오히려 덜 오른 것이다. */
  const SHORT={'필라델피아 반도체':'반도체','상하이종합':'상하이','대만 가권':'대만'};
  /* 칸이 좁아도 숫자가 잘리면 안 된다. 1,000 이 넘는 지수는 칸에서는 정수로 줄이고,
     소수점까지는 글로벌 화면에서 본다. 국내 지수는 칸이 넓은 폰 · 태블릿에서는 소수점까지 보인다. */
  const dec2=v=>v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const short=v=>Math.abs(v)>=1000?Math.round(v).toLocaleString():dec2(v);
  function ixTile(g){
    let v='–';
    if(g.last!=null){
      v = g.kind==='kr' && Math.abs(g.last)>=1000
        ? `<span class="vf">${dec2(g.last)}</span><span class="vi">${short(g.last)}</span>`
        : short(g.last);
    }
    return `<div class="ix"><div class="n">${esc(SHORT[g.name]||g.name)}${g.stale?` <span class="s">${g.stale}분 전</span>`:''}</div>
      <div class="v num">${v}</div><div class="c num ${cls(g.chg)}">${fmt(g.chg)}</div></div>`;
  }
  function indexCard(){
    const G=d.globals||[];
    const krh=d.is_today===false&&d.trade_day?`국내 ${Number(d.trade_day.slice(5,7))}월 ${Number(d.trade_day.slice(8))}일 마감`:'국내';
    const rows=[[krh,'kr','k3'],[(d.us&&d.us.label)||'미국 어젯밤 마감','us',''],['아시아 지금','asia','']]
      .map(([label,kind,k])=>{ const it=G.filter(g=>g.kind===kind); if(!it.length) return '';
        return `<div class="ixg"><div class="ixh">${label}</div><div class="ixrow ${k}">${it.map(ixTile).join('')}</div></div>`; }).join('');
    if(!rows) return '';
    return `<div class="card"><div class="chead"><span class="ctitle">지수</span>
        <button class="more" data-go="global">환율 · 선물 ›</button></div>
      <div class="cbody"><div class="ixwrap">${rows}</div></div></div>`;
  }

  /* 시장 전체 수급과 종목 폭. 네이버 증권 지수 화면 숫자 그대로. */
  const eok=v=>(v>0?'+':'')+Math.round(v).toLocaleString()+'억';
  function marketBlock(){
    const M=(d.market||[]).filter(x=>x&&x.inv);
    if(!M.length) return '';
    const G=n=>(d.globals||[]).find(g=>g.name===n);
    return M.map(x=>{
      const i=x.inv, b=x.breadth||{}, idx=G(x.name);
      const ok=['foreign','inst','personal'].every(k=>typeof i[k]==='number');
      const tot=(b.rise||0)+(b.fall||0)+(b.steady||0);
      const pc=n=>tot?(n/tot*100).toFixed(2):0;
      // 지수 방향과 종목 방향이 엇갈리면 그대로 적는다. 소수 대형주가 끌어올린 장인지 보이게.
      let note='';
      if(idx&&typeof idx.chg==='number'&&tot){
        if(idx.chg>0.2&&b.fall>b.rise) note=`지수는 올랐는데 내린 종목이 더 많습니다. <b>일부 큰 종목이 끌어올린 장</b>입니다.`;
        else if(idx.chg<-0.2&&b.rise>b.fall) note=`지수는 빠졌는데 오른 종목이 더 많습니다. <b>일부 큰 종목이 끌어내린 장</b>입니다.`;
      }
      return `<div class="mk"><div class="mkh">${esc(x.name)} 수급<span class="f">${d.is_live?'장중 잠정 · ':''}억원</span></div>
        ${ok?`<div class="inv">
          <div><div class="k">외국인</div><div class="v num ${cls(i.foreign)}">${eok(i.foreign)}</div></div>
          <div><div class="k">기관</div><div class="v num ${cls(i.inst)}">${eok(i.inst)}</div></div>
          <div><div class="k">개인</div><div class="v num ${cls(i.personal)}">${eok(i.personal)}</div></div></div>`:''}
        ${tot?`<div class="brd"><i class="up" style="width:${pc(b.rise)}%"></i><i class="fl" style="width:${pc(b.steady)}%"></i><i class="dn" style="width:${pc(b.fall)}%"></i></div>
          <div class="brdl"><span class="u">오른 종목 ${b.rise}</span><span class="d">내린 종목 ${b.fall}</span><span>보합 ${b.steady}</span>${b.upper?`<span class="u">상한가 ${b.upper}</span>`:''}${b.lower?`<span class="d">하한가 ${b.lower}</span>`:''}</div>`:''}
        ${note?`<div class="insight">${note}</div>`:''}</div>`;
    }).join('');
  }

  /* ── 오늘 체크: 오늘 · 내일 일정과 경제 헤드라인 ──
     헤드라인은 네이버 증권 '주요 뉴스' 제목만 보여주고, 누르면 원문으로 간다.
     업종이 오르고 내린 이유로 읽히지 않게 숫자 칸과 떼어 둔다. */
  const NEWS_HOME='https://m.stock.naver.com/investment/news/mainnews';
  const newsBox={items:null,at:0,err:false,loading:false};
  const kstDay=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  function nwTime(at){
    if(!at) return '';
    return at.slice(0,10)===kstDay() ? at.slice(11,16) : `${Number(at.slice(5,7))}/${Number(at.slice(8,10))} ${at.slice(11,16)}`;
  }
  function nwRows(items,n,tag){
    return `<div class="nwl">`+items.slice(0,n).map(x=>`<a class="nw" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">
        <span class="nt">${esc(x.t)}</span>
        <span class="nm">${tag&&x.tag?`<span class="tg">${esc(x.tag)}</span> · `:''}${esc(x.src)}${x.at?' · '+esc(nwTime(x.at)):''}</span></a>`).join('')+`</div>`;
  }
  function newsHTML(){
    if(newsBox.items===null) return '<div class="note">헤드라인을 불러오는 중입니다.</div>';
    if(!newsBox.items.length) return `<div class="note">헤드라인을 불러오지 못했습니다. <a class="nwmore" href="${NEWS_HOME}" target="_blank" rel="noopener noreferrer">네이버 증권 주요 뉴스에서 보기 ›</a></div>`;
    return nwRows(newsBox.items,5)+`<a class="nwmore" href="${NEWS_HOME}" target="_blank" rel="noopener noreferrer">주요 뉴스 더 보기 ›</a>`;
  }
  function paintNews(){
    const el=document.getElementById('chk-news'); if(el) el.innerHTML=newsHTML();
  }
  function loadNews(){
    if(newsBox.loading||(newsBox.at&&Date.now()-newsBox.at<600000)) return;
    newsBox.loading=true;
    fetch('/api/news').then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(j=>{ Object.assign(newsBox,{items:j.items||[],at:Date.now(),err:false,loading:false}); paintNews(); })
      .catch(()=>{ Object.assign(newsBox,{items:newsBox.items||[],at:Date.now(),err:true,loading:false}); paintNews(); });
  }
  function checkCard(){
    loadNews();
    const cal=calNow(), near=cal.filter(e=>e.dday<=1), list=near.length?near:cal.slice(0,1);
    const evs=list.length?list.map(e=>`<div class="cev"><span class="dd2 ${e.dday<=1?'now':''} num">${esc(e.dtext)}</span>
        <span class="tt">${esc(e.title)}${e.note?` <span class="nn">${esc(e.note)}</span>`:''}</span></div>`).join('')
      : '<div class="note">가까운 일정이 없습니다.</div>';
    return `<div class="card chk"><div class="chead"><span class="ctitle">오늘 체크</span>
        <button class="more" data-go="more">일정 전체 ›</button></div>
      <div class="cbody">
        <div class="blk"><h4>${near.length?'오늘 · 내일 일정':'다음 일정'}</h4>${evs}</div>
        <div class="blk"><h4>경제 헤드라인<span class="f">제목만 · 누르면 원문</span></h4>
          <div id="chk-news">${newsHTML()}</div></div>
      </div></div>`;
  }

  /* 업종 관련 헤드라인. 업종 이름이나 시가총액 상위 종목 이름이 제목에 들어간 것만. 참고용. */
  const secNews={};
  function paintSecNews(no){
    const el=document.getElementById('sec-news'); if(el&&el.dataset.no==String(no)) el.innerHTML=secNewsHTML(no);
  }
  function loadSecNews(s){
    if(s.no==null) return;
    const v=secNews[s.no];
    if(v&&(v.loading||Date.now()-v.at<1200000)) return;
    secNews[s.no]={items:v?v.items:null,at:Date.now(),loading:true};
    fetch(`/api/news?no=${s.no}&name=${encodeURIComponent(s.name)}`).then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(j=>{ secNews[s.no]={items:j.items||[],at:Date.now()}; paintSecNews(s.no); })
      .catch(()=>{ secNews[s.no]={items:[],at:Date.now(),err:true}; paintSecNews(s.no); });
  }
  function secNewsHTML(no){
    const v=secNews[no];
    if(!v||v.items===null) return '<div class="note">불러오는 중입니다.</div>';
    if(!v.items.length) return `<div class="note">${v.err?'헤드라인을 불러오지 못했습니다.':'최근 나흘 안에 이 업종 이름이 들어간 제목이 없습니다.'}</div>`;
    return nwRows(v.items,4,true);
  }

  /* 잠깐 봐도 오늘이 어떤 날이었는지 알게 하는 칸.
     막대 하나로 오른 업종과 빠진 업종의 비율을 보여준다. */
  function glance(){
    const S=(d.sectors||[]).filter(s=>s.chg!==null&&s.chg!==undefined);
    if(!S.length) return '';
    const tot=S.length;
    const up=S.filter(s=>s.chg>0).length, dn=S.filter(s=>s.chg<0).length, fl=tot-up-dn;
    const pc=n=>tot?(n/tot*100).toFixed(2):0;
    const lead=(d.top_in&&d.top_in[0])?byName[d.top_in[0]]:null;
    return `<div class="card"><div class="chead"><span class="ctitle">${d.is_today===false&&d.trade_day?`${Number(d.trade_day.slice(5,7))}월 ${Number(d.trade_day.slice(8))}일`:'오늘'} 한눈에</span>
        <span class="more" style="cursor:default">업종 ${tot}개</span></div>
      <div class="cbody">
        <div class="split"><i class="up" style="width:${pc(up)}%"></i><i class="fl" style="width:${pc(fl)}%"></i><i class="dn" style="width:${pc(dn)}%"></i></div>
        <div class="gl"><span class="u">오른 업종 ${up}</span><span class="d">빠진 업종 ${dn}</span>${fl?`<span class="f">보합 ${fl}</span>`:''}</div>
        ${lead?`<div class="gl2">가장 센 곳 <b>${esc(lead.name)}</b>
          <span class="num ${cls(lead.chg)}">${fmt(lead.chg)}</span>
          ${lead.total?`<span class="f">${lead.total}개 중 ${lead.rise}개 상승</span>`:''}</div>`:''}
        ${marketBlock()}
      </div></div>`;
  }

  /* ── 전체 섹터 ── */
  function scSectors(){
    const f=route.tab, names=['전체','상승','하락','중립'];
    let list=d.sectors; if(term) list=list.filter(s=>s.name.includes(term));
    const ups=list.filter(s=>s.chg>0.3), dns=list.filter(s=>s.chg<-0.3), flat=list.filter(s=>Math.abs(s.chg)<=0.3);
    const L=(c,t,n)=>`<div class="glab ${c}">${t}<button class="more" data-tab="${n}">더보기 ›</button></div>`;
    let body;
    if(f===1) body=L('in','↗ 상승 섹터',1)+toneRows(ups);
    else if(f===2) body=L('out','↘ 하락 섹터',2)+toneRows(dns);
    else if(f===3) body=L('','→ 중립 섹터',3)+toneRows(flat);
    else body=L('in','↗ 상승 섹터',1)+toneRows(ups)+L('out','↘ 하락 섹터',2)+toneRows(dns)
             +(flat.length?L('','→ 중립 섹터',3)+toneRows(flat):'');
    return `<div class="chips" role="tablist">${names.map((t,i)=>`<button class="chip" role="tab" data-tab="${i}" aria-selected="${f===i}">${t}</button>`).join('')}</div>
      ${body}
      <p class="note"><b>섹터란.</b> 개별 종목이 아니라 업종 묶음입니다. 업종 안 종목들의 등락을 묶어서 봅니다.<br>
        <b>'16개 중 8개 상승'이 왜 붙어 있나.</b> 같은 +3%라도 전 종목이 오른 것과 한두 개가 끌어올린 것은 다릅니다. 그 차이를 그대로 적어 둡니다.</p>`;
  }

  /* ── 자금 흐름 ── */
  function scFlow(){
    const names=['전체','개인','기관','외국인'];
    const max=Math.max(1,...d.sectors.map(s=>Math.abs(s.chg)));
    const ups=d.sectors.filter(s=>s.chg>0).slice(0,5).map(s=>s.name);
    const dns=d.sectors.filter(s=>s.chg<0).slice(-5).reverse().map(s=>s.name);
    return `<div class="chips" role="tablist">${names.map((t,i)=>`<button class="chip" role="tab" data-tab="0" aria-selected="${i===0}" ${i?'disabled':''}>${t}</button>`).join('')}</div>
      <div class="card"><div class="chead"><span class="ctitle">상위 유입 섹터</span></div>
        <div class="cbody">${rankRows(ups,max,'up')}</div></div>
      <div class="card"><div class="chead"><span class="ctitle out">상위 유출 섹터</span></div>
        <div class="cbody">${rankRows(dns,max,'dn')}</div></div>
      <p class="note"><b>순위는 등락률과 참여율로 매깁니다.</b> 같은 등락률이면 업종 안에서 더 많은 종목이 같이 움직인 쪽을 위로 올립니다.<br>
        <b>업종별 개인 · 기관 · 외국인 수급은 아직 없습니다.</b> 시장 전체 수급은 홈 '한눈에' 칸에서 봅니다.</p>`;
  }

  /* ── 상세 ── */
  function candles(s,h){
    let c=100; const pts=s.spark.map(r=>{const o=c; c=c*(1+r/100); return {o,c,r};});
    const lo=Math.min(...pts.map(p=>Math.min(p.o,p.c))), hi=Math.max(...pts.map(p=>Math.max(p.o,p.c)));
    const pad=(hi-lo)*0.25||1, min=lo-pad, span=(hi+pad)-min;
    const labs=s.spark_days&&s.spark_days.length===s.spark.length
      ? s.spark_days : s.spark.map((_,i)=>`${s.spark.length-i}일 전`);
    return `<div class="candles" style="height:${h}px">`+pts.map((p,i)=>{
      const top=Math.max(p.o,p.c), bot=Math.min(p.o,p.c);
      const t=(1-(top-min)/span)*100, b=(1-(bot-min)/span)*100;
      const bh=Math.max(4,b-t), wt=Math.max(0,t-6), wh=bh+12;
      return `<div class="cd"><div class="plot">
        <span class="wick" style="top:${wt}%;height:${wh}%"></span>
        <span class="body" style="top:${t}%;height:${bh}%;background:${col(p.r)};opacity:${p.r>=0?1:.92}"></span>
      </div><span class="lb">${labs[i]}</span></div>`;
    }).join('')+`</div>`;
  }
  /* 업종 하루 흐름. 예약 실행기가 10분마다 찍어 둔 등락률을 선으로 잇는다. */
  const intraBox={};
  function loadIntra(name){
    const hit=intraBox[name];
    if(hit&&(hit==='loading'||(hit.at&&Date.now()-hit.at<60000))) return;
    intraBox[name]='loading';
    fetch('/api/intraday?name='+encodeURIComponent(name)).then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(j=>{ intraBox[name]={at:Date.now(),day:j.day,points:j.points||[]}; if(route.name==='detail') render(); })
      .catch(()=>{ intraBox[name]={at:Date.now(),points:[]}; if(route.name==='detail') render(); });
  }
  function intraLine(name){
    const v=intraBox[name];
    if(!v||v==='loading') return '<div class="note">불러오는 중입니다.</div>';
    const P=v.points||[];
    if(P.length<2) return '<div class="note"><b>아직 그릴 게 없습니다.</b><br>장중 10분마다 한 점씩 쌓입니다. 개장하고 20분쯤 지나면 선이 생깁니다.</div>';
    const W=320,H=150,pad=10, vals=P.map(p=>p.v);
    const lo=Math.min(0,...vals), hi=Math.max(0,...vals), span=(hi-lo)||1;
    const x=i=>pad+(W-2*pad)*i/(P.length-1), y=v=>pad+(H-2*pad)*(1-(v-lo)/span);
    const last=vals[vals.length-1], c=col(last);
    const pts=P.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const day=v.day?`${Number(v.day.slice(5,7))}월 ${Number(v.day.slice(8))}일`:'';
    return `<svg class="iline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(name)} 하루 등락률 흐름">
        <line class="zero" x1="${pad}" x2="${W-pad}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>
        <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="iaxis"><span>${esc(P[0].t)}</span><span>${esc(day)} · 점선이 전일 종가</span><span>${esc(P[P.length-1].t)} <b class="num ${cls(last)}">${fmt(last)}</b></span></div>`;
  }

  /* 업종 구성 종목. 상세의 '종목' 탭에서만 부르고, 한 번 받으면 기억해 둔다. */
  const stocksBox={};
  function loadStocks(no){
    if(no==null || stocksBox[no]!==undefined) return;
    stocksBox[no]='loading';
    fetch('/api/industry/'+no).then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(j=>{ stocksBox[no]=j.stocks||[]; if(route.name==='detail') render(); })
      .catch(()=>{ stocksBox[no]='error'; if(route.name==='detail') render(); });
  }
  function stockRows(no){
    const v=stocksBox[no];
    if(v===undefined||v==='loading') return '<div class="note">불러오는 중입니다.</div>';
    if(v==='error') return '<div class="note">종목 목록을 불러오지 못했습니다.</div>';
    if(!v.length) return '<div class="note">표시할 종목이 없습니다.</div>';
    return `<div class="llist">`+v.map(t=>`
      <div class="lrow"><span class="ln">${esc(t.name)}${t.out?'<span class="tag">계산 제외</span>':''}</span>
        <span class="ll num">${t.price?t.price.toLocaleString():'–'}</span>
        <span class="lc num ${cls(t.chg)}">${fmt(t.chg)}</span></div>`).join('')+`</div>`;
  }
  function scDetail(name){

            <div class="lrow"><span class="ln">최근 ${s.spark.length}거래일 누적</span><span class="lc num ${cls(s.chg5)}">${fmt(s.chg5)}</span></div>
          </div></div></div>`
        : `<div class="card"><div class="chead"><span class="ctitle">최근 거래일 흐름</span></div>
            <div class="cbody"><div class="note"><b>아직 그릴 게 없습니다.</b><br>
              마감마다 하루치가 저장됩니다. 이틀치가 모이면 여기에 캔들이 생기고, 5거래일까지 늘어납니다.</div></div></div>
          <div class="card"><div class="chead"><span class="ctitle">오늘</span></div><div class="cbody"><div class="llist">

    } else if(route.tab===2){
      loadStocks(s.no);
      panel=`<div class="card"><div class="chead"><span class="ctitle">${esc(s.name)} 구성 종목</span>
          <span class="more" style="cursor:default">${s.total?s.total+'개':''}</span></div>
          <div class="cbody">${stockRows(s.no)}</div></div>
        <p class="note"><b>이건 추천이 아닙니다.</b> 업종 등락률이 어떻게 나왔는지 보여주는 내역일 뿐입니다.
          이 화면은 종목을 고르는 곳이 아니라, 돈이 어느 업종으로 갔는지 보는 곳입니다.</p>`;
    } else {
      panel=`<div class="stats">
          <div class="stat"><div class="k">오늘 등락률</div><div class="v num ${cls(s.chg)}">${fmt(s.chg)}</div>
            <div class="s f">${esc(d.market_label||'')}</div></div>
          <div class="stat"><div class="k">구성 종목</div><div class="v num">${s.total??'–'}</div>
            <div class="s f">개</div></div>
          <div class="stat"><div class="k">오른 종목</div><div class="v num u">${s.rise??'–'}</div>
            <div class="s num ${s.total&&s.rise/s.total>=0.6?'u':s.total&&s.rise/s.total<=0.4?'d':'f'}">${s.total?Math.round(s.rise/s.total*100)+'%':'–'}</div></div>
        </div>
        ${s.excluded&&s.excluded.length?`<div class="card"><div class="chead"><span class="ctitle">숫자를 바로잡았습니다</span></div>
          <div class="cbody"><div class="note"><b>${esc(s.excluded.join(', '))}</b> 종목을 계산에서 뺐습니다.<br>
            하루 가격제한폭(±30%)을 넘은 종목입니다. 상장 첫날이거나 거래가 다시 열린 종목이라 어제 가격이 없습니다.
            이런 종목이 섞이면 업종 숫자가 부풀어서, 빼고 다시 계산했습니다.<br>
            네이버 원래 숫자 <b class="num">${fmt(s.naver_chg)}</b> → 바로잡은 숫자 <b class="num">${fmt(s.chg)}</b></div></div></div>`:''}
        <div class="card"><div class="chead"><span class="ctitle">업종 안에서 무슨 일이</span></div>
          <div class="cbody"><div class="llist">
            <div class="lrow"><span class="ln">상승</span><span class="ll num">${s.rise??'–'}</span><span class="lc u">개</span></div>
            <div class="lrow"><span class="ln">하락</span><span class="ll num">${s.fall??'–'}</span><span class="lc d">개</span></div>
            <div class="lrow"><span class="ln">보합</span><span class="ll num">${s.steady??'–'}</span><span class="lc f">개</span></div>
          </div></div></div>
        <div class="card"><div class="chead"><span class="ctitle">구성 종목</span>
          <button class="more" data-tab="2">더보기 ›</button></div>
          <div class="cbody"><div class="note">${esc(breadth(s)||'집계 중')}</div></div></div>
        <div class="card chk"><div class="chead"><span class="ctitle">관련 헤드라인</span>
          <span class="more" style="cursor:default">참고용</span></div>
          <div class="cbody"><div id="sec-news" data-no="${s.no}">${(loadSecNews(s),secNewsHTML(s.no))}</div>
          <div class="note" style="margin-top:8px">업종 이름이나 시가총액 상위 종목 이름이 제목에 들어간 기사입니다. 오르고 내린 이유라고 단정하지 않습니다.</div></div></div>`;
    }
    return `<div class="seg" role="tablist">${tabs.map((t,i)=>`<button role="tab" data-tab="${i}" aria-selected="${route.tab===i}">${t}</button>`).join('')}</div>
      ${panel}
      <button class="cta" data-watch="${esc(s.name)}" aria-pressed="${isW(s.name)}">
        <svg viewBox="0 0 24 24"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1z"/></svg>
        ${isW(s.name)?'관심에서 빼기':'관심 섹터에 추가'}</button>`;
  }

  function scGlobal(){

    return `<div class="chips" role="tablist">${names.map((t,i)=>`<button class="chip" role="tab" data-jump="${i}" aria-selected="${route.tab===i}">${t}</button>`).join('')}</div>
      ${globalCards()}
      <p class="note"><b>왜 보는가.</b> 한국 장은 미국 밤장을 따라 여는 경우가 많습니다. 아침에는 미국 마감과 선물을, 장중에는 선물과 아시아를 봅니다.<br>
        <b>업종 숫자는 지수와 나란히 봐야 합니다.</b> 업종이 +2% 여도 코스피가 +3% 면 시장보다 덜 오른 것입니다.</p>`;
  }

  const I_SEARCH=`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.6 16.6 4.2 4.2"/></svg>`;

  /* 상세 머리글 한 줄: 업종 안 몇 개가 같이 움직였나, 코스피보다 얼마나 더 갔나, 30분 새 속도 */
  function heroLine(s){
    const k=(d.globals||[]).find(g=>g.name==='코스피'), bits=[];
    if(s.total) bits.push(breadth(s));
    if(k&&typeof k.chg==='number'&&typeof s.chg==='number'){
      const g=Math.round((s.chg-k.chg)*100)/100;
      bits.push(`코스피보다 ${g>0?'+':''}${g.toFixed(2)}%p`);
    }
    if(d.is_live&&typeof s.d30==='number') bits.push(`30분 새 ${s.d30>0?'+':''}${s.d30.toFixed(2)}%p`);
    return bits.join(' · ');
  }

  function render(){
    renderTop();
    sbar.className='sbar'+(search&&(route.name==='sectors'||route.name==='home')?' on':'');
    const al=(d.errors&&d.errors.length)?`<div class="alert">수집 실패: ${esc(d.errors.join(', '))} · 화면에서 빠져 있습니다.</div>`:'';
    const bp=bell?`<div class="panel"><b>${esc(d.updated_label)}</b> · ${esc(d.market_label)}<br>
      화면은 장중 30초마다 갱신 · 업종 기록 장중 10분마다 · 개장 전 알림 08:37 · 마감 기록 15:40</div>`:'';
    const body = route.name==='home'?scHome() : route.name==='sectors'?scSectors() :
      route.name==='global'?scGlobal() : route.name==='watch'?scWatch() :
      route.name==='more'?scMore() : route.name==='flow'?scFlow() :
      route.name==='detail'?scDetail(route.arg) : '';
    view.innerHTML=al+bp+body;
    document.querySelectorAll('.nav button').forEach(b=>{
      const on=b.dataset.go===route.name||(route.name==='detail'&&b.dataset.go==='sectors')||(route.name==='flow'&&b.dataset.go==='home');
      if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0,0);
  }
  function go(n,a){ route={name:n,arg:a||null,tab:0}; bell=false; render(); }

  document.addEventListener('click',e=>{
    const nav=e.target.closest('.nav button'); if(nav){ go(nav.dataset.go); return; }
    const act=e.target.closest('[data-act]');
    if(act){ if(act.dataset.act==='search'){ search=!search; if(!search){term='';q.value='';}
        if(route.name==='home') route={name:'sectors',arg:null,tab:0};
        render(); if(search) q.focus(); } else { bell=!bell; render(); } return; }
    const w=e.target.closest('[data-watch]');
    if(w){ const n=w.dataset.watch; watch=isW(n)?watch.filter(x=>x!==n):watch.concat(n); save(); render(); return; }
    const mg=e.target.closest('.more[data-go]'); if(mg){ go(mg.dataset.go); return; }
    const jp=e.target.closest('[data-jump]');
    if(jp){ route.tab=+jp.dataset.jump; render();
      const el=document.getElementById('g'+jp.dataset.jump); if(el) el.scrollIntoView({block:'start'}); return; }
    const tab=e.target.closest('[data-tab]'); if(tab){ route.tab=+tab.dataset.tab; render(); return; }
    const op=e.target.closest('[data-open]'); if(op){ go('detail',op.dataset.open); return; }
  });
  q.addEventListener('input',()=>{ term=q.value.trim(); if(route.name==='sectors') render(); });
  render();

  /* ── 실시간 갱신 ──
     화면이 열려 있는 동안 /api/live 를 직접 불러 온다.
     미리 구워 둔 DATA 는 첫 화면과 통신 실패 때의 예비용으로 남는다.
     일정(calendar)은 빌드할 때 계산한 값을 그대로 쓴다. */
  let timer=null, fails=0;
  function later(ms){ clearTimeout(timer); timer=setTimeout(pull,ms); }
  async function pull(){
    try{
      const r=await fetch('/api/live');
      if(!r.ok) throw new Error(r.status);
      const j=await r.json();
      if(!j || j.error || !Array.isArray(j.sectors) || !j.sectors.length) throw new Error('empty');
      fails=0;
      d=Object.assign({},DATA,j,{calendar:DATA.calendar});
      byName=Object.fromEntries(d.sectors.map(s=>[s.name,s]));
      render();
      later(j.market_status==='open' ? 30000 : 300000);
    }catch(e){
      fails++;
      later(fails>=3 ? 600000 : 60000);
    }
  }
  pull();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); });
})();
</script>
</body>
</html>
